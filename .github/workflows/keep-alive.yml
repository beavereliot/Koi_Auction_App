name: Keep Supabase alive

on:
  schedule:
    - cron: '0 12 */3 * *'  # Every 3 days at noon UTC
  workflow_dispatch:         # Allow manual trigger from GitHub Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "apikey: sb_publishable__rKIdmzzCEZnRFhOUn6nAQ_yOt6bOwk" \
            -H "Authorization: Bearer sb_publishable__rKIdmzzCEZnRFhOUn6nAQ_yOt6bOwk" \
            "https://ilrnqxgojgrpkkinaapm.supabase.co/rest/v1/settings?select=id&limit=1")
          echo "Supabase responded with HTTP $STATUS"
          if [ "$STATUS" != "200" ]; then exit 1; fi
