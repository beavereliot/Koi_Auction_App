<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Pikes Peak Koi Auction</title>
    <link rel="stylesheet" href="style.css" />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  </head>
  <body>
    <div class="app">

      <div class="topbar">
        <div class="topbar-inner">
          <img src="Koi_LOGO.jpg" alt="Pikes Peak Koi Logo" class="logo-img" />
          <div class="topbar-text">
            <div class="topbar-title">Pikes Peak Koi & Water Garden Society</div>
            <div class="topbar-sub" id="auction-subtitle">Loading...</div>
          </div>
          <div class="live-badge"><span class="live-dot"></span> Live</div>
        </div>
      </div>

      <nav class="nav">
        <div class="nav-item active" data-page="dashboard">📊 Dashboard</div>
        <div class="nav-item" data-page="donors">👥 Donors</div>
        <div class="nav-item" data-page="fish">🐠 Fish</div>
        <div class="nav-item" data-page="bidders">🪪 Bidders</div>
        <div class="nav-item" data-page="scribe">✍️ Scribe</div>
        <div class="nav-item" data-page="checkout">🧾 Checkout</div>
        <div class="nav-item" data-page="misc">🛒 Misc</div>
        <div class="nav-item" data-page="admin">⚙️ Admin</div>
        <div class="nav-item" data-page="manual">📖 Manual</div>
      </nav>

      <main class="content" id="main-content">
        <p style="color:#4db8d4; padding:2rem;">Loading...</p>
      </main>

    </div>

    <div id="print-area"></div>

    <script src="app.js"></script>
  </body>
</html>
