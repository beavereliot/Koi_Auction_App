<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Pikes Peak Koi Auction</title>
    <link rel="stylesheet" href="style.css?v=4" />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js"></script>
  </head>
  <body>
    <div class="app">

      <!-- ① Hero banner — grid top-right on desktop, topmost on mobile -->
      <div class="hero-banner">
        <div class="live-badge"><span class="live-dot"></span> Live</div>
        <!-- Mobile-only title overlay at bottom of banner -->
        <div class="mobile-brand">
          <img src="Koi_LOGO.jpg" alt="Logo" class="mobile-brand-logo" />
          <div>
            <div class="mobile-brand-title">Pikes Peak Koi &amp; Water Garden Society</div>
            <div class="mobile-brand-sub auction-subtitle">Loading...</div>
          </div>
        </div>
      </div>

      <!-- ② Sidebar — left column on desktop, horizontal nav strip on mobile -->
      <aside class="sidebar">
        <div class="sidebar-brand">
          <img src="Koi_LOGO.jpg" alt="Pikes Peak Koi Logo" class="logo-img" />
          <div class="sidebar-title">Pikes Peak Koi &amp; Water Garden Society</div>
          <div class="sidebar-sub auction-subtitle">Loading...</div>
        </div>

        <nav class="sidebar-nav">

          <div class="nav-item active" data-page="dashboard">
            <svg class="nav-icon" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg">
              <rect x="2" y="2" width="7" height="7" rx="1.5" stroke="currentColor" stroke-width="1.5" fill="none"/>
              <rect x="11" y="2" width="7" height="7" rx="1.5" stroke="currentColor" stroke-width="1.5" fill="none"/>
              <rect x="2" y="11" width="7" height="7" rx="1.5" stroke="currentColor" stroke-width="1.5" fill="none"/>
              <rect x="11" y="11" width="7" height="7" rx="1.5" stroke="currentColor" stroke-width="1.5" fill="none"/>
            </svg>
            Dashboard
          </div>

          <div class="nav-item" data-page="donors">
            <svg class="nav-icon" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg">
              <circle cx="10" cy="6" r="3.5" stroke="currentColor" stroke-width="1.5" fill="none"/>
              <path d="M3 18.5c0-3.8 3.1-6.5 7-6.5s7 2.7 7 6.5" stroke="currentColor" stroke-width="1.5" fill="none" stroke-linecap="round"/>
              <path d="M15 9.5h2.5M16.25 8.25v2.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
            </svg>
            Donors
          </div>

          <div class="nav-item" data-page="fish">
            <svg class="nav-icon" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg">
              <path d="M2 10c3-5.5 9.5-7 14-4.5" stroke="currentColor" stroke-width="1.5" fill="none" stroke-linecap="round"/>
              <path d="M2 10c3 5.5 9.5 7 14 4.5"  stroke="currentColor" stroke-width="1.5" fill="none" stroke-linecap="round"/>
              <path d="M16 5.5l3.5-3-1.5 5"  stroke="currentColor" stroke-width="1.3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M16 14.5l3.5 3-1.5-5" stroke="currentColor" stroke-width="1.3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
              <circle cx="6.5" cy="10" r="1.5" fill="currentColor"/>
            </svg>
            Fish
          </div>

          <div class="nav-item" data-page="bidders">
            <svg class="nav-icon" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg">
              <circle cx="7" cy="6" r="3" stroke="currentColor" stroke-width="1.5" fill="none"/>
              <path d="M2 18c0-3.2 2.2-5.5 5-5.5" stroke="currentColor" stroke-width="1.5" fill="none" stroke-linecap="round"/>
              <rect x="11" y="10.5" width="7.5" height="6" rx="1" stroke="currentColor" stroke-width="1.5" fill="none"/>
              <line x1="13" y1="13.5" x2="17" y2="13.5" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
              <line x1="13" y1="15.2" x2="15.5" y2="15.2" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
            </svg>
            Bidders
          </div>

          <div class="nav-item" data-page="scribe">
            <svg class="nav-icon" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg">
              <path d="M3.5 17l2.5-7.5L15 2l3 3-9 7.5-5.5 4.5z" stroke="currentColor" stroke-width="1.5" fill="none" stroke-linejoin="round"/>
              <path d="M12 5l3 3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
              <path d="M3.5 17q1.5 1 2.5 0" stroke="currentColor" stroke-width="1.3" fill="none" stroke-linecap="round"/>
            </svg>
            Scribe
          </div>

          <div class="nav-item" data-page="checkout">
            <svg class="nav-icon" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg">
              <path d="M5 3h10a1 1 0 011 1v12.5l-2-1-2 1-2-1-2 1-2-1V4a1 1 0 011-1z" stroke="currentColor" stroke-width="1.5" fill="none" stroke-linejoin="round"/>
              <line x1="7.5" y1="7.5"  x2="12.5" y2="7.5"  stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
              <line x1="7.5" y1="10.5" x2="12.5" y2="10.5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
              <line x1="7.5" y1="13"   x2="10.5" y2="13"   stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
            </svg>
            Checkout
          </div>

          <div class="nav-item" data-page="misc">
            <svg class="nav-icon" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg">
              <path d="M7.5 8V6a2.5 2.5 0 015 0v2" stroke="currentColor" stroke-width="1.5" fill="none" stroke-linecap="round"/>
              <path d="M3.5 8h13l-1.2 9.5H4.7L3.5 8z" stroke="currentColor" stroke-width="1.5" fill="none" stroke-linejoin="round"/>
            </svg>
            Misc
          </div>

          <div class="nav-item" data-page="admin">
            <svg class="nav-icon" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg">
              <path d="M10 17c-4-1-6-4-6-7 0-2 .8-3.5 2-4.5.3 2.5 1.8 5.2 4 6.5z"           stroke="currentColor" stroke-width="1.3" fill="none" stroke-linejoin="round"/>
              <path d="M10 17c4-1 6-4 6-7 0-2-.8-3.5-2-4.5-.3 2.5-1.8 5.2-4 6.5z"            stroke="currentColor" stroke-width="1.3" fill="none" stroke-linejoin="round"/>
              <path d="M10 17c-2.5-2.2-3.5-5-3-7.5.3-1.2 1-2 1.8-2.5.2 2 0 4 .2 5.5.2 1.5.7 3 1 4.5z" stroke="currentColor" stroke-width="1.3" fill="none" stroke-linejoin="round"/>
              <path d="M10 17c2.5-2.2 3.5-5 3-7.5-.3-1.2-1-2-1.8-2.5-.2 2 0 4-.2 5.5-.2 1.5-.7 3-1 4.5z" stroke="currentColor" stroke-width="1.3" fill="none" stroke-linejoin="round"/>
              <line x1="10" y1="17" x2="10" y2="19" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
            </svg>
            Admin
          </div>

          <div class="nav-item" data-page="manual">
            <svg class="nav-icon" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg">
              <path d="M4 16V5a1 1 0 011-1h11v12H5a1 1 0 01-1-1z" stroke="currentColor" stroke-width="1.5" fill="none"/>
              <path d="M4 16a1 1 0 001 1h11"                        stroke="currentColor" stroke-width="1.5" fill="none" stroke-linecap="round"/>
              <line x1="8" y1="8"  x2="13" y2="8"  stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
              <line x1="8" y1="11" x2="13" y2="11" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
              <line x1="8" y1="14" x2="11" y2="14" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
            </svg>
            Manual
          </div>

        </nav>

        <div class="sidebar-art">
          <img src="assets/koi-dark.png" alt="" />
        </div>
      </aside>

      <!-- ③ Main content — grid bottom-right on desktop, last on mobile -->
      <main class="content" id="main-content">
        <p style="color:#c93a2f; padding:2rem;">Loading...</p>
      </main>

    </div>

    <div id="print-area"></div>
    <script src="app.js?v=4"></script>
  </body>
</html>
